name: Bug report
description: Report a problem with micmute.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that cause the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, processor architecture, app version, and microphone model. Mention other microphone control apps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant errors. Remove personal information before submitting. Do not attach settings or credentials.
